---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: vs-source-hub-views
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: vs-source-create-views
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- range $managedCluster := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items }}
            {{- if and (ne (index $managedCluster.metadata.labels "name") "local-cluster") (ne (index $managedCluster.metadata.labels "app-role") "active") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: view.open-cluster-management.io/v1beta1
                kind: ManagedClusterView
                metadata:
                  name: volsync-dest-info-quarkus-web-app-volsync
                  namespace: {{ $managedCluster.metadata.name }}
                  labels:
                    app: volsync
                    volsync-role: destination-info
                spec:
                  scope:
                    name: quarkus-mysql-volsync-destination-standby
                    namespace: quarkus-web-app-volsync
                    kind: ReplicationDestination
                    apiGroup: volsync.backube
                    version: v1alpha1
            {{- end }}
            {{- end }}
            {{- $mcvList := (lookup "view.open-cluster-management.io/v1beta1" "ManagedClusterView" "" "").items }}
            {{- range $mcv := $mcvList }}
            {{- if and (index $mcv.metadata.labels "volsync-role") (eq (index $mcv.metadata.labels "volsync-role") "destination-info") }}
            {{- $shouldDelete := true }}
            {{- range $managedCluster := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items }}
            {{- if and (ne (index $managedCluster.metadata.labels "name") "local-cluster") (ne (index $managedCluster.metadata.labels "app-role") "active") }}
            {{- if eq $mcv.metadata.namespace $managedCluster.metadata.name }}
            {{- $shouldDelete = false }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $shouldDelete }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: view.open-cluster-management.io/v1beta1
                kind: ManagedClusterView
                metadata:
                  name: {{ $mcv.metadata.name }}
                  namespace: {{ $mcv.metadata.namespace }}
            {{- end }}
            {{- end }}
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: vs-dest-info-hub
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: vs-dest-info-configmap
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- $dr := (lookup "v1" "ConfigMap" "open-cluster-management-global-set" "volsync-dr-config").data }}
            {{- $submariner := and $dr (eq ($dr.submarinerEnabled | default "false") "true") }}
            {{- $mcvList := (lookup "view.open-cluster-management.io/v1beta1" "ManagedClusterView" "" "").items }}
            {{- range $mcv := $mcvList }}
            {{- if and (index $mcv.metadata.labels "volsync-role") (eq (index $mcv.metadata.labels "volsync-role") "destination-info") }}
            {{- if $mcv.status.result }}
            {{- $dest := $mcv.status.result }}
            {{- if or $submariner $dest.status.rsyncTLS.address }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: volsync-dest-info-quarkus-web-app-volsync
                  namespace: open-cluster-management-global-set
                data:
                  # Under Submariner the destination is reached at its exported
                  # clusterset.local address; otherwise the LoadBalancer address
                  # published in the ReplicationDestination status is used.
                  address: {{ if $submariner }}{{ $dr.address | quote }}{{ else }}{{ $dest.status.rsyncTLS.address | quote }}{{ end }}
                  keySecret: {{ $dest.spec.rsyncTLS.keySecret | quote }}
                  storageClassName: {{ $dest.spec.rsyncTLS.storageClassName | default "" | quote }}
                  volumeSnapshotClassName: {{ $dest.spec.rsyncTLS.volumeSnapshotClassName | default "" | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: vs-source-active
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: vs-dest-info-configmap-copy
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{hub- $cm := (lookup "v1" "ConfigMap" "open-cluster-management-global-set" "volsync-dest-info-quarkus-web-app-volsync") hub}}
            {{hub- if $cm hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: volsync-dest-info-quarkus-web-app-volsync
                  namespace: quarkus-web-app-volsync
                data:
                  address: {{hub $cm.data.address | quote hub}}
                  keySecret: {{hub $cm.data.keySecret | quote hub}}
                  storageClassName: {{hub $cm.data.storageClassName | quote hub}}
                  volumeSnapshotClassName: {{hub $cm.data.volumeSnapshotClassName | quote hub}}
            {{hub- end hub}}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: vs-source-create-replicationsource
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- $cm := (lookup "v1" "ConfigMap" "quarkus-web-app-volsync" "volsync-dest-info-quarkus-web-app-volsync") }}
            {{- if and $cm $cm.data }}
            {{- if $cm.data.address }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: volsync.backube/v1alpha1
                kind: ReplicationSource
                metadata:
                  name: volsync-source-info-quarkus-web-app-volsync
                  namespace: quarkus-web-app-volsync
                spec:
                  sourcePVC: mysql-pvc
                  trigger:
                    schedule: "*/5 * * * *"
                  rsyncTLS:
                    keySecret: {{ $cm.data.keySecret }}
                    address: {{ $cm.data.address | quote }}
                    copyMethod: Snapshot
                    {{- if ne $cm.data.storageClassName "" }}
                    storageClassName: {{ $cm.data.storageClassName }}
                    {{- end }}
                    {{- if ne $cm.data.volumeSnapshotClassName "" }}
                    volumeSnapshotClassName: {{ $cm.data.volumeSnapshotClassName }}
                    {{- end }}
            {{- end }}
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: vs-dest-active-del
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: volsync-destination-delete-active
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- /* Scoped to THIS use case's namespace. A cluster-wide lookup ("" for
                   the namespace) makes this policy delete EVERY ReplicationDestination
                   on the active spoke - including the ones Ramen creates for use case 1
                   when it protects PVCs with VolSync. That coexists only while use case
                   1's primary and use case 3's active happen to be the same cluster;
                   fail over one without the other and this policy tears down the other
                   use case's replication. The -vm variant was already scoped this way. */}}
            {{- range $volsyncdest := (lookup "volsync.backube/v1alpha1" "ReplicationDestination" "quarkus-web-app-volsync" "").items }}
            {{- /* Do not delete a destination while VolSync is mid-transfer; a
                   Synchronizing=True condition means an rsync is landing on this
                   receive endpoint and tearing it down would abort the in-flight
                   session (the peer source is guarded the same way). The policy
                   re-evaluates on its interval, so the destination is removed on
                   a later pass once the sync completes. */}}
            {{- $syncing := false }}
            {{- if $volsyncdest.status }}
            {{- range $cond := ($volsyncdest.status.conditions | default list) }}
            {{- if and (eq $cond.type "Synchronizing") (eq $cond.status "True") }}
            {{- $syncing = true }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if not $syncing }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: volsync.backube/v1alpha1
                kind: ReplicationDestination
                metadata:
                  name: {{ $volsyncdest.metadata.name }}
                  namespace: {{ $volsyncdest.metadata.namespace }}
            {{- end }}
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: vs-source-standby-del
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: volsync-replicationsource-delete-standby
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- /* Namespace-scoped for the same reason as the destination-delete policy
                   above: a cluster-wide lookup would delete Ramen's ReplicationSource on
                   the standby and break use case 1 whenever the two use cases' roles
                   diverge. */}}
            {{- range $volsyncsrc := (lookup "volsync.backube/v1alpha1" "ReplicationSource" "quarkus-web-app-volsync" "").items }}
            {{- /* Do not delete a source while VolSync is mid-transfer; a
                   Synchronizing=True / SyncInProgress condition means an rsync
                   is in flight and tearing it down could corrupt the standby
                   snapshot. The policy re-evaluates on its interval, so the
                   source is removed on a later pass once the sync completes. */}}
            {{- $syncing := false }}
            {{- if $volsyncsrc.status }}
            {{- range $cond := ($volsyncsrc.status.conditions | default list) }}
            {{- if and (eq $cond.type "Synchronizing") (eq $cond.status "True") }}
            {{- $syncing = true }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if not $syncing }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: volsync.backube/v1alpha1
                kind: ReplicationSource
                metadata:
                  name: {{ $volsyncsrc.metadata.name }}
                  namespace: {{ $volsyncsrc.metadata.namespace }}
            {{- end }}
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: vs-dest-standby
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: volsync-destination-pvc-standby
        spec:
          remediationAction: enforce
          severity: low
          # serviceType + storage classes come from the hub volsync-dr-config
          # ConfigMap (written by deployapp). Under Submariner: ClusterIP (the
          # service is exported across the clusterset); otherwise LoadBalancer.
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: volsync.backube/v1alpha1
                kind: ReplicationDestination
                metadata:
                  name: quarkus-mysql-volsync-destination-standby
                  namespace: quarkus-web-app-volsync
                spec:
                  trigger:
                    schedule: "*/2 * * * *"
                  rsyncTLS:
                    serviceType: '{{hub fromConfigMap "open-cluster-management-global-set" "volsync-dr-config" "serviceType" hub}}'
                    copyMethod: Snapshot
                    destinationPVC: mysql-pvc
                    storageClassName: '{{hub fromConfigMap "open-cluster-management-global-set" "volsync-dr-config" "storageClassName" hub}}'
                    keySecret: volsync-rsync-tls-mysql-replicationsource
                    volumeSnapshotClassName: '{{hub fromConfigMap "open-cluster-management-global-set" "volsync-dr-config" "volumeSnapshotClassName" hub}}'
---

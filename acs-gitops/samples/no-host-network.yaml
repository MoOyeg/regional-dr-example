---
# Inform-only: spec.enforcementActions is omitted, so Central will alert but
# not block. Add enforcementActions to enforce.
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gitops-sample-no-host-network
  namespace: stackrox
spec:
  policyName: "GitOps Sample - No Host Network"
  description: "Flags pods that share the host network namespace."
  rationale: >-
    hostNetwork: true exposes the node's network interfaces directly and
    bypasses NetworkPolicy enforcement.
  remediation: >-
    Set hostNetwork: false (or remove it) from the pod spec. Use a Service or
    HostPort if a single port really needs to be exposed on the node.
  categories:
    - Privileges
  severity: HIGH_SEVERITY
  lifecycleStages:
    - DEPLOY
  eventSource: NOT_APPLICABLE
  policySections:
    - sectionName: "Pod uses hostNetwork"
      policyGroups:
        - fieldName: "Host Network"
          booleanOperator: OR
          values:
            - value: "true"
  exclusions:
    - name: "Don't alert on openshift namespaces"
      deployment:
        scope:
          namespace: openshift-.*
    - name: "Don't alert on kube-system"
      deployment:
        scope:
          namespace: kube-system

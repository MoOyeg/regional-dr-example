---
# =============================================================================
# VolSync Direct DR - App (Quarkus + MySQL) - Use case 3
# =============================================================================
# Ported/adapted from MoOyeg/sno-disaster-recovery. An ALTERNATIVE DR engine to
# use case 1 (ODF mirroring + Ramen): VolSync syncs the app's mysql-pvc directly
# spoke-to-spoke over rsync-tls, orchestrated by ACM policies keyed on the
# `app-role: active/standby` ManagedCluster label. Failover = flip the label on
# the hub; GitOps moves the app onto the new active spoke and the policies swap
# the ReplicationSource/Destination roles. Runs in the dedicated
# `quarkus-web-app-volsync` namespace so it coexists with the Ramen-based use case 1.
#
# Prerequisites: deploy + operators + import + infra-dr (Submariner + ODF +
# `dr-clusters` clusterset) + GitOps (the `app` command wires ArgoCD to the spokes)
# + VolSync CRDs on the spokes (Ramen/odr-cluster-operator pulls VolSync in).
#
# NOTE: written + syntax-checked, NOT yet run on live clusters.
# =============================================================================
- name: "VolSync Direct DR (app): deploy + wire label-flip failover"
  hosts: openshift_clusters
  gather_facts: false

  vars:
    artifacts_dir: "{{ playbook_dir }}/artifacts"
    gitops_namespace: "openshift-gitops"
    hub_kubeconfig: "{{ playbook_dir }}/artifacts/{{ cluster_name }}/kubeconfig"
    psk_secret_name: "volsync-rsync-tls-mysql-replicationsource"
    rd_service: "volsync-rsync-tls-dst-quarkus-mysql-volsync-destination-standby"

  pre_tasks:
    - name: Run only on the hub cluster
      meta: end_host
      when: cluster_role | default('spoke') != 'hub'

    - name: Validate hub kubeconfig exists
      stat:
        path: "{{ hub_kubeconfig }}"
      register: kubeconfig_stat
      delegate_to: localhost

    - name: End host if kubeconfig missing
      meta: end_host
      when: not kubeconfig_stat.stat.exists

    - name: Build ordered list of spoke clusters
      set_fact:
        spoke_clusters: >-
          {{ groups['openshift_clusters']
             | map('extract', hostvars)
             | selectattr('cluster_role', 'defined')
             | selectattr('cluster_role', 'equalto', 'spoke')
             | map(attribute='cluster_name') | list
          + groups['openshift_clusters']
             | map('extract', hostvars)
             | rejectattr('cluster_role', 'defined')
             | map(attribute='cluster_name') | list }}

    - name: Build managedcluster name mapping for spokes
      set_fact:
        managedcluster_names: >-
          {
          {% for c in spoke_clusters %}
          {% set v = hostvars[c] %}
          "{{ c }}": "{{ v.managedcluster_name | default(c) }}"{{ "," if not loop.last }}
          {% endfor %}
          }

    - name: Resolve active / standby spokes
      set_fact:
        volsync_active_cluster: "{{ volsync_active | default(spoke_clusters[0]) }}"
        volsync_standby_clusters: "{{ spoke_clusters | difference([volsync_active | default(spoke_clusters[0])]) }}"

    - name: Validate the chosen active spoke is a real spoke
      fail:
        msg: "volsync_active='{{ volsync_active_cluster }}' is not one of the spokes ({{ spoke_clusters | join(', ') }})."
      when: volsync_active_cluster not in spoke_clusters

    - name: Show plan
      debug:
        msg: "VolSync app DR — active={{ volsync_active_cluster }}, standby={{ volsync_standby_clusters | join(', ') }}, ns={{ volsync_app_namespace }}"

  tasks:
    # =========================================================================
    # 1. Role labels on the hub — this is the failover control surface
    # =========================================================================
    - name: Label the active spoke app-role=active
      shell: |
        oc label managedcluster {{ managedcluster_names[volsync_active_cluster] }} app-role=active --overwrite
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost

    - name: Label standby spokes app-role=standby
      shell: |
        oc label managedcluster {{ managedcluster_names[item] }} app-role=standby --overwrite
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost
      loop: "{{ volsync_standby_clusters }}"

    - name: Ensure spokes are in the dr-clusters ManagedClusterSet
      shell: |
        oc label managedcluster {{ managedcluster_names[item] }} \
          cluster.open-cluster-management.io/clusterset={{ managed_cluster_set_name }} --overwrite
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost
      loop: "{{ spoke_clusters }}"

    # =========================================================================
    # 1b. Ensure VolSync is installed on each spoke (ACM VolSync addon). The repo
    #     does not otherwise install VolSync; the RS/RD movers need its CRDs.
    # =========================================================================
    - name: Install the VolSync addon on each spoke
      shell: |
        oc apply -f - <<'EOF'
        apiVersion: addon.open-cluster-management.io/v1alpha1
        kind: ManagedClusterAddOn
        metadata:
          name: volsync
          namespace: {{ managedcluster_names[item] }}
        spec:
          installNamespace: volsync-system
        EOF
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost
      loop: "{{ spoke_clusters }}"

    - name: Wait for VolSync CRDs to appear on each spoke
      shell: |
        oc --kubeconfig {{ artifacts_dir }}/{{ item }}/kubeconfig get crd replicationsources.volsync.backube
      delegate_to: localhost
      loop: "{{ spoke_clusters }}"
      register: volsync_crd_wait
      until: volsync_crd_wait.rc == 0
      retries: 30
      delay: 20
      changed_when: false

    # =========================================================================
    # 2. Pre-shared rsync-tls key, and namespace + PVC + secret on BOTH spokes
    #    (the standby's ReplicationDestination writes into mysql-pvc, so the PVC
    #    and the PSK must exist on both).
    # =========================================================================
    # The PSK must be REUSED across re-runs. stunnel inside the VolSync mover reads
    # psk.txt once at startup and never reloads it, so rotating the key on a live
    # deployment breaks replication until the long-lived DESTINATION mover pod is
    # cycled - and it fails silently: the ReplicationSource keeps publishing
    # lastSyncTime while the ReplicationDestination records none, so only the mover
    # logs show it ("decrypt error" on the source, "binder does not verify" on the
    # destination). Found live 2026-07-28.
    - name: Look for an existing rsync-tls pre-shared key on the spokes
      shell: |
        oc --kubeconfig {{ artifacts_dir }}/{{ item }}/kubeconfig -n {{ volsync_app_namespace }} \
          get secret {{ psk_secret_name }} -o jsonpath='{.data.psk\.txt}' 2>/dev/null | base64 -d 2>/dev/null || true
      delegate_to: localhost
      loop: "{{ spoke_clusters }}"
      register: volsync_psk_existing
      changed_when: false

    - name: Generate an rsync-tls pre-shared key (only if none exists yet)
      shell: 'echo "volsync:$(openssl rand -hex 32)"'
      register: volsync_psk_new
      changed_when: false
      delegate_to: localhost

    - name: Settle on the pre-shared key to distribute
      set_fact:
        volsync_psk_value: >-
          {{ (volsync_psk_existing.results | map(attribute='stdout') | select('search', '^volsync:') | list | first)
             | default(volsync_psk_new.stdout, true) }}

    - name: Report which key is in use
      debug:
        msg: >-
          rsync-tls PSK: {{ 'REUSED from the spokes (movers keep working)'
                            if (volsync_psk_existing.results | map(attribute='stdout') | select('search', '^volsync:') | list | length) > 0
                            else 'newly generated (first deployment)' }}

    - name: Create namespace + PVC + secret on each spoke
      shell: |
        oc --kubeconfig {{ artifacts_dir }}/{{ item }}/kubeconfig apply \
          -f {{ playbook_dir }}/app-volsync/namespace.yaml \
          -f {{ playbook_dir }}/app-volsync/mysql-pvc.yaml \
          -f {{ playbook_dir }}/app-volsync/mysql-secret.yaml
      delegate_to: localhost
      loop: "{{ spoke_clusters }}"

    - name: Create the rsync-tls PSK secret on each spoke
      shell: |
        oc --kubeconfig {{ artifacts_dir }}/{{ item }}/kubeconfig -n {{ volsync_app_namespace }} \
          create secret generic {{ psk_secret_name }} \
          --from-literal=psk.txt='{{ volsync_psk_value }}' \
          --dry-run=client -o yaml | oc --kubeconfig {{ artifacts_dir }}/{{ item }}/kubeconfig apply -f -
      delegate_to: localhost
      loop: "{{ spoke_clusters }}"
      register: volsync_psk_apply

    # Belt and braces: if the key did change (partial/legacy state), any mover pod
    # still holds the old one in stunnel's memory - cycle them so the new key takes.
    - name: Restart VolSync mover pods whose key changed
      shell: |
        oc --kubeconfig {{ artifacts_dir }}/{{ item }}/kubeconfig -n {{ volsync_app_namespace }} \
          delete pod -l app.kubernetes.io/created-by=volsync --ignore-not-found
      delegate_to: localhost
      loop: "{{ spoke_clusters }}"
      when: volsync_psk_apply.results | selectattr('stdout', 'search', 'configured') | list | length > 0

    # =========================================================================
    # 3. Submariner ServiceExport for the destination rsync Service (both spokes;
    #    harmless where the Service is absent). Consumed as <svc>.<ns>.svc.clusterset.local.
    # =========================================================================
    - name: Export the destination rsync Service across the clusterset
      shell: |
        oc --kubeconfig {{ artifacts_dir }}/{{ item }}/kubeconfig apply -f - <<'EOF'
        apiVersion: multicluster.x-k8s.io/v1alpha1
        kind: ServiceExport
        metadata:
          name: {{ rd_service }}
          namespace: {{ volsync_app_namespace }}
        EOF
      delegate_to: localhost
      loop: "{{ spoke_clusters }}"
      when: volsync_use_submariner | default(true)

    # =========================================================================
    # 4. Hub volsync-dr-config — the policies read storage classes + address from here
    # =========================================================================
    - name: Create the volsync-dr-config ConfigMap on the hub
      shell: |
        oc apply -f - <<'EOF'
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: volsync-dr-config
          namespace: {{ volsync_policy_namespace }}
        data:
          submarinerEnabled: "{{ volsync_use_submariner | default(true) | string | lower }}"
          serviceType: "{{ 'ClusterIP' if (volsync_use_submariner | default(true)) else 'LoadBalancer' }}"
          storageClassName: "{{ volsync_storage_class }}"
          volumeSnapshotClassName: "{{ volsync_snapshot_class }}"
          address: "{{ rd_service }}.{{ volsync_app_namespace }}.svc.clusterset.local"
        EOF
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost

    # =========================================================================
    # 5. ManagedClusterSetBinding for dr-clusters in the policy + GitOps namespaces
    # =========================================================================
    - name: Bind the dr-clusters ManagedClusterSet to the policy + GitOps namespaces
      shell: |
        oc apply -f - <<'EOF'
        apiVersion: cluster.open-cluster-management.io/v1beta2
        kind: ManagedClusterSetBinding
        metadata:
          name: {{ managed_cluster_set_name }}
          namespace: {{ item }}
        spec:
          clusterSet: {{ managed_cluster_set_name }}
        EOF
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost
      loop:
        - "{{ volsync_policy_namespace }}"
        - "{{ gitops_namespace }}"

    # =========================================================================
    # 6. The VolSync ACM policy engine (6 policies + placements + bindings)
    # =========================================================================
    - name: Apply the VolSync automation policies
      shell: |
        oc apply -f {{ playbook_dir }}/acm-policy-volsync-automate.yaml
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost

    # =========================================================================
    # 7. GitOps: ApplicationSet renders the workload onto whichever spoke is
    #    labeled app-role=active (follows failover). Bound to the policy's
    #    volsync-app-placement-active Placement in openshift-gitops.
    # =========================================================================
    - name: Create the app ApplicationSet (active spoke only)
      shell: |
        oc apply -f - <<'EOF'
        apiVersion: argoproj.io/v1alpha1
        kind: ApplicationSet
        metadata:
          name: quarkus-volsync-appset
          namespace: {{ gitops_namespace }}
        spec:
          generators:
            - clusterDecisionResource:
                configMapRef: acm-placement
                labelSelector:
                  matchLabels:
                    cluster.open-cluster-management.io/placement: volsync-app-placement-active
                requeueAfterSeconds: 60
          template:
            metadata:
              name: 'quarkus-volsync-{% raw %}{{name}}{% endraw %}'
            spec:
              project: default
              source:
                repoURL: {{ app_git_url }}
                targetRevision: {{ app_git_branch }}
                path: app-volsync/workload
              destination:
                server: '{% raw %}{{server}}{% endraw %}'
                namespace: {{ volsync_app_namespace }}
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
                syncOptions:
                  - CreateNamespace=true
        EOF
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost

    - name: Wait for the VolSync policies to report Compliant (best-effort)
      shell: |
        oc get policy -n {{ volsync_policy_namespace }} \
          -o jsonpath='{range .items[*]}{.metadata.name}={.status.compliant}{"\n"}{end}' \
          | grep -E '^vs-' || true
      environment: { KUBECONFIG: "{{ hub_kubeconfig }}" }
      delegate_to: localhost
      register: vs_policy_status
      changed_when: false

    - name: Show result + failover instructions
      debug:
        msg: |
          ============================================
          VolSync Direct DR (app) deployed
          ============================================
          Active spoke:  {{ volsync_active_cluster }}  (workload + ReplicationSource)
          Standby spoke: {{ volsync_standby_clusters | join(', ') }}  (ReplicationDestination)
          Namespace:     {{ volsync_app_namespace }}   RPO: {{ volsync_source_schedule }}
          Policy status:
          {{ vs_policy_status.stdout }}

          Verify:
            oc --kubeconfig artifacts/{{ volsync_active_cluster }}/kubeconfig get replicationsource -n {{ volsync_app_namespace }}
            oc --kubeconfig artifacts/{{ volsync_standby_clusters[0] }}/kubeconfig get replicationdestination -n {{ volsync_app_namespace }}

          Fail over (label flip on the hub — GitOps + policies do the rest):
            oc --kubeconfig artifacts/{{ cluster_name }}/kubeconfig label managedcluster {{ managedcluster_names[volsync_standby_clusters[0]] }} app-role=active --overwrite
            oc --kubeconfig artifacts/{{ cluster_name }}/kubeconfig label managedcluster {{ managedcluster_names[volsync_active_cluster] }} app-role=standby --overwrite

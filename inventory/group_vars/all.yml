---
# Global variables for all clusters
# These can be overridden in host_vars for specific clusters

# OpenShift version (exact x.y.z - the Containerfile pulls this exact release from
# the mirror at /clients/ocp/<version>/, so this MUST be a full z-version, e.g.
# "4.22.5". A bare minor like "4.22" or a "stable-<minor>" value will 404.)
openshift_version: "4.22.5"

# AWS account selection (sno-cluster-ocpv style): each cluster picks its AWS
# account via a named profile in ~/.aws/credentials ([section] per account),
# set as `aws_profile` in that cluster's host_vars. Credentials are read with
# lookup('ini', ..., section=aws_profile, file=aws_shared_credentials_file).
# ansible-runner.sh mounts the host's ~/.aws/credentials into the container and
# sets AWS_SHARED_CREDENTIALS_FILE; otherwise this falls back to $HOME/.aws/credentials.
aws_profile: ""
aws_shared_credentials_file: "{{ lookup('env', 'AWS_SHARED_CREDENTIALS_FILE') if (lookup('env', 'AWS_SHARED_CREDENTIALS_FILE') | length > 0) else (lookup('env', 'HOME') + '/.aws/credentials') }}"

# Default AWS settings
aws_instance_type: "m5.2xlarge"
aws_root_volume_size: 120
aws_create_eip: true
aws_zone_count: 1

# Node topology (SNO defaults: 1 master, 0 workers)
control_plane_replicas: 1
control_plane_instance_type: "m5.2xlarge"
worker_replicas: 0
# worker_instance_type: "m5.xlarge"  # Only used when worker_replicas > 0

# Minimal infrastructure deploy
# =========================================================================
# When `minimal_infra: true` (e.g. via `ansible-runner.sh deploy --minimal`),
# EVERY cluster is forced to Single-Node OpenShift (1 master, 0 workers) with a
# role-specific instance type, overriding whatever is in host_vars:
#   - hub   -> a large regular EC2 VM (runs the ACM/GitOps/ODF-noobaa control plane)
#   - spoke -> a bare-metal (.metal) instance, because OpenShift Virtualization
#              needs hardware virtualization (KVM), which AWS only exposes on
#              .metal instances. Each spoke's single node also doubles as its
#              Submariner gateway - no dedicated gateway machine is provisioned
#              (see tasks/setup-submariner.yml).
# Override the instance types to trade cost vs capacity.
minimal_infra: false
minimal_hub_instance_type: "m5.8xlarge"     # large VM for the hub SNO (ACM+GitOps+ODF+logging+ACS)
minimal_spoke_instance_type: "c5n.metal"    # bare-metal for spoke SNO (KVM for CNV)

# Cluster role for DR operators (hub or spoke)
cluster_role: spoke

# ACM ManagedCluster name mapping
# =========================================================================
# When a cluster is imported into ACM, it gets a ManagedCluster resource name.
# For the hub cluster (self-import), this is typically "local-cluster".
# For spoke clusters, this is usually the cluster name, but can be customized.
#
# Override in host_vars if your ManagedCluster name differs from cluster_name:
#   managedcluster_name: "custom-name"
#
# If not set, defaults to:
#   - "local-cluster" for hub clusters (cluster_role: hub)
#   - cluster_name for spoke clusters
# =========================================================================

# Operator channels
acm_channel: "release-2.17"
odf_channel: "stable-4.21"
oadp_channel: "stable"

# ManagedClusterSet name for DR
managed_cluster_set_name: "dr-clusters"

# Submariner globalnet
# Disabled: the spokes are installed with NON-OVERLAPPING pod/service/machine
# CIDRs (see cluster2/cluster3 host_vars), so Submariner routes pods directly
# without globalnet. This is REQUIRED for cross-cluster live migration (cclm) -
# globalnet only routes to exported Services, not to the ephemeral virt-launcher
# pod IPs the VM migration data plane targets. Set back to true only if you
# revert the spokes to overlapping/default CIDRs.
globalnet_enabled: false
globalnet_cidr_range: "242.0.0.0/8"
# Cable driver: "vxlan" (default) or "libreswan" (IPsec, has known issues with Submariner v0.22+)
submariner_cable_driver: "vxlan"
# Include hub (local-cluster) in the Submariner ManagedClusterSet
# Set to true if the hub cluster should also participate in Submariner networking
submariner_include_hub: false

# ODF StorageCluster settings (for spoke clusters)
odf_storage_class: "gp3-csi"
odf_storage_size: "512Gi"
odf_device_set_count: 1
odf_device_set_replica: 3
# Minimal/SNO ODF: with minimal_infra, the StorageCluster uses flexibleScaling
# (failure domain = host) with replica 1 and this many OSDs on the single node.
odf_minimal_device_set_count: 3
# StorageClass ODF creates for virtualization workloads (RWX / volumeMode Block).
# It is set as the default *virtualization* StorageClass so VM disks land on RWX Block
# (required for live-migratable VMs and for cross-cluster live migration) instead of the
# cluster-wide default (gp3-csi, which is RWO Filesystem).
odf_virt_storage_class: "ocs-storagecluster-ceph-rbd-virtualization"

# Cert-manager / Let's Encrypt settings
# =========================================================================
# The certs command will:
# 1. Install cert-manager operator from OperatorHub
# 2. Create a ClusterIssuer for Let's Encrypt with Route53 DNS-01 solver
# 3. Generate a wildcard certificate for *.apps.<base-domain>
# 4. Patch the IngressController to use the certificate
#
# Prerequisites:
# - AWS credentials must be set (export AWS_ACCESS_KEY_ID_N, AWS_SECRET_ACCESS_KEY_N)
# - AWS credential set must have Route53 permissions for DNS-01 validation
# - acme_email MUST be set (used for Let's Encrypt account registration)
# =========================================================================

# cert-manager operator channel
certmanager_channel: "stable-v1"

# Let's Encrypt ACME server
# Use staging for testing (won't be trusted by browsers, but rate-limited less)
# acme_server: "https://acme-staging-v02.api.letsencrypt.org/directory"
# Use production for real certificates (be careful with rate limits!)
acme_server: "https://acme-v02.api.letsencrypt.org/directory"

# Email address for Let's Encrypt registration (REQUIRED for certs command!)
# This email will receive certificate expiry notifications
acme_email: "mojojoye@yahoo.com"

# ClusterIssuer and Certificate names
acme_issuer_name: "letsencrypt"
cert_name: "acme-wildcard-cert"
cert_secret_name: "acme-wildcard-cert-secret"

# NetObserv Network Traffic Monitoring
# =========================================================================
# The netobserv command will install network traffic monitoring on clusters
# marked with netobserv: true in inventory/host_vars/<cluster>.yml
#
# Features:
# - Loki operator for centralized log storage
# - NetObserv operator for network flow collection
# - S3 bucket for Loki backend storage
# - FlowCollector with eBPF agent for traffic analysis
#
# Prerequisites:
# - AWS credentials with S3 and IAM permissions
# - netobserv: true label in cluster host_vars
#
# Example cluster configuration:
#   cat inventory/host_vars/cluster-netobserv.yml
#   cluster_name: cluster-netobserv
#   aws_profile: cluster1        # named profile in ~/.aws/credentials
#   aws_region: us-east-1
#   netobserv: true         # Enable NetObserv on this cluster
# =========================================================================

# Loki operator channel (fallback; setup-netobserv.yml auto-discovers the latest stable-X.Y channel)
loki_channel: "stable-6.4"

# NetObserv operator channel (fallback; setup-netobserv.yml auto-discovers the latest stable channel)
netobserv_channel: "stable"

# ACS (Advanced Cluster Security) Configuration
# =========================================================================
# The acs command will install RHACS (Red Hat Advanced Cluster Security)
# with Central on the hub cluster and SecuredCluster on all managed clusters.
#
# Prerequisites:
# - ACM installed on hub (run ./ansible-runner.sh operators first)
# - Spoke clusters imported (run ./ansible-runner.sh import first)
#
# What it does:
# 1. Installs ACS operator directly on hub cluster
# 2. Creates Central CR on hub (with route, PVC, scanner)
# 3. Generates init bundle via Central API
# 4. Creates ACM Policy to deploy ACS operator + SecuredCluster on managed clusters
# 5. Injects init bundle TLS secrets to managed clusters via hub templates
#
# Configuration in inventory/host_vars/<cluster>.yml:
#   acs: true    # Enable ACS SecuredCluster on this cluster (only needed if acs_deploy_all_clusters: false)
# =========================================================================

# ACS operator channel (fallback; setup-acs.yml auto-discovers the latest stable channel)
acs_channel: "stable"

# Central instance name
acs_central_name: "stackrox-central-services"

# Central PVC storage size
acs_central_pvc_size: "100Gi"

# Scanner autoscaling settings
acs_scanner_min_replicas: 2
acs_scanner_max_replicas: 5
acs_scanner_replicas: 3

# Whether to deploy SecuredCluster to ALL managed clusters or only those with acs: true
# When true: deploys to all managed clusters (uses global ManagedClusterSet)
# When false: deploys only to clusters with acs: true in host_vars
acs_deploy_all_clusters: true

# DR Application Deployment
# =========================================================================
# The app command deploys TWO DR-protected instances of a sample application
# (Quarkus + MySQL) with DRPlacementControl for automated failover:
#
#   Instance 1 (GitOps): Deployed via OpenShift GitOps (ArgoCD) in push mode.
#     - Installs GitOps operator on hub, registers spokes with ArgoCD
#     - ApplicationSet with ClusterDecisionResource generator
#     - DRPlacementControl manages failover by changing PlacementDecision
#     - Namespace: {{ app_namespace }} (e.g., quarkus-web-app)
#
#   Instance 2 (Direct): Manifests applied directly to primary spoke.
#     - oc apply manifests to spoke_clusters[0]
#     - DRPlacementControl with kubeObjectProtection for failover
#     - Namespace: {{ app_namespace }}-direct (e.g., quarkus-web-app-direct)
#
# Prerequisites:
# 1. Clusters deployed: ./ansible-runner.sh deploy
# 2. Operators installed: ./ansible-runner.sh operators
# 3. Clusters imported: ./ansible-runner.sh import
# 4. DR infrastructure configured: ./ansible-runner.sh infra-dr
# 5. App manifests accessible via Git (set app_git_url below)
#
# The app/ directory in this repo contains the adapted manifests:
# - namespace.yaml: quarkus-web-app namespace
# - mysql-secret.yaml: MySQL credentials
# - mysql-pvc.yaml: PVC with ocs-storagecluster-ceph-rbd StorageClass
# - mysql-deployment.yaml: MySQL 8.0 Deployment + headless Service
# - app-deployment.yaml: Quarkus app Deployment + Service + Route
#
# Push this repo to a Git server and set app_git_url to the repo URL.
# =========================================================================

# Which application instance(s) use case 1 deploys:
#   gitops (default) - ArgoCD ApplicationSet pushes the app to the DR cluster;
#                      this is the flow the README walks through.
#   direct           - the same manifests applied with `oc apply`, no GitOps.
#                      DR-protected too, since it is then the only instance.
#   both             - deploy both, in separate namespaces. Only the GitOps one
#                      is DR-protected unless app_protect_direct_instance=true.
#
# Why `both` does not protect both by default: two DR-protected instances of the
# same app on one storage class collide on ODF versions that group PVCs into
# consistency groups. The group id comes from the storage class, not the app, so
# both PVCs land in the same RBD group - and an RBD image may belong to only one
# group. The second VolumeGroupReplication fails in Ceph with
# "rbd: ret=-22, Invalid argument", that DRPC never leaves Protected=False, and
# the ODF DR dashboard goes critical. Clearing it means Ceph surgery on a
# MIRRORED group, which breaks the peer's promote and strands any in-flight
# failover. Found live 2026-07-30.
#   ./ansible-runner.sh app -e app_deployment_mode=direct
app_deployment_mode: "gitops"
app_protect_direct_instance: false

# The ODF Multicluster Orchestrator creates `ramen-operator-group` in
# openshift-dr-system on each spoke when `app` configures the DRPolicy/MirrorPeer.
# `operators` therefore does NOT create one: a second OperatorGroup in that
# namespace makes OLM fail odr-cluster-operator with TooManyOperatorGroups.
# Set true only when installing the DR cluster operator without the orchestrator.
dr_create_operatorgroup: false

# Application namespace (GitOps instance; Direct instance uses {{ app_namespace }}-direct)
app_namespace: "quarkus-web-app"

# Application name (used for naming RHACM resources)
app_name: "quarkus-mysql-app"

# Git repository URL containing app manifests (REQUIRED for app command)
# Point this to your fork/copy of this repository pushed to a Git server
# Example: https://github.com/user/regional-dr-example.git
app_git_url: "https://github.com/MoOyeg/regional-dr-example.git"

# Git branch containing the app manifests
app_git_branch: "main"

# Path within the Git repo to the app manifests directory
app_git_path: "app"

# DRPolicy name (cluster-scoped resource on hub)
dr_policy_name: "dr-policy"

# Async replication schedule interval for Ceph RBD mirroring
dr_replication_interval: "5m"

# StorageClass for app PVCs (must support Ceph RBD mirroring)
app_pvc_storage_class: "ocs-storagecluster-ceph-rbd"

# VolSync Direct DR (use case 3) - label-flip (app-role) failover, no Ramen
# =========================================================================
# An ALTERNATIVE DR engine to use case 1: instead of ODF mirroring + Ramen DRPC,
# VolSync syncs PVCs directly spoke-to-spoke over rsync-tls, orchestrated by ACM
# policies keyed on the `app-role: active/standby` ManagedCluster label. Failover
# is a LABEL FLIP on the hub (no redeploy): the active spoke runs the workload +
# a VolSync ReplicationSource; the standby runs a ReplicationDestination; GitOps
# moves the app onto whichever spoke is labeled active. Deployed into DEDICATED
# namespaces so it coexists with the Ramen-based use case 1 (which owns
# quarkus-web-app / vm-example). Ported from MoOyeg/sno-disaster-recovery.
# See "Use case 3" in the README.
volsync_app_namespace: "quarkus-web-app-volsync"
volsync_vm_namespace: "vm-example-volsync"
volsync_storage_class: "ocs-storagecluster-ceph-rbd"              # RWO Block for the app/VM PVCs
volsync_snapshot_class: "ocs-storagecluster-rbdplugin-snapclass"  # VolSync copyMethod: Snapshot
volsync_use_submariner: true            # true = ClusterIP + ServiceExport (svc.clusterset.local); false = LoadBalancer
volsync_source_schedule: "*/5 * * * *"  # ReplicationSource cadence = the RPO
volsync_dest_schedule: "*/2 * * * *"    # ReplicationDestination cadence
volsync_app_pvc: "mysql-pvc"            # app data PVC replicated by VolSync
volsync_vm_pvc: "vm-data-pvc"           # VM data-disk PVC replicated by VolSync
# ACM namespace the VolSync DR policies live in (the global-set ns exists in ACM 2.x)
volsync_policy_namespace: "open-cluster-management-global-set"
# Active spoke (runs the workload + ReplicationSource); the other spoke is standby.
# Defaults to spoke_clusters[0]; override: ./ansible-runner.sh volsync-dr -e volsync_active=cluster3
# volsync_active: "cluster2"

# OADP (OpenShift API for Data Protection) backup & recovery - use case 4
# =========================================================================
# Back up a VM namespace on one spoke to an S3 bucket and restore it on the other.
# The OADP operator is installed by `operators`; `oadp` provisions the bucket +
# DataProtectionApplication, and `oadp-backup` / `oadp-restore` drive a backup and
# restore. Both spokes' OADP use the SAME bucket-owner AWS credentials so a single
# bucket (in oadp_aws_profile's account) is reachable from both. See "use case 4".
oadp_namespace: "openshift-adp"
oadp_aws_profile: "default"               # AWS account that owns the backup bucket
oadp_s3_region: "us-east-2"
oadp_s3_bucket: ""                        # empty -> auto-named oadp-dr-<managed_cluster_set_name>
oadp_dpa_name: "dpa-dr"
oadp_bsl_name: "dr-s3"
oadp_backup_vm_namespace: "vm-example"    # namespace backed up / restored
oadp_backup_name: "vm-backup"

# OADP scheduled, label-driven backups (use case 4, ACM policy)
# =========================================================================
# `oadp` also creates an ACM Policy (acm-policy-oadp-schedule.yaml, enforced on
# the spokes) that watches VirtualMachines: label a VM with `oadp-backup` and the
# policy creates a Velero `Schedule` (the OADP-native "backup cronjob") that backs
# that VM's namespace up every 5 minutes with a 1-hour TTL, to the same S3 bucket.
# Remove the label -> the Schedule is pruned. A second (inform) policy confirms
# backups are being produced. With */5 + 1h TTL, steady state is ~12 live backups.
# The policy file hardcodes these values (standard); they are documented here.
oadp_backup_label: "oadp-backup"          # label a VM with this to enable scheduled backups
oadp_schedule_cron: "*/5 * * * *"         # Velero Schedule cron (every 5 minutes)
oadp_backup_schedule_ttl: "1h0m0s"        # each scheduled backup expires after 1 hour
oadp_policy_namespace: "open-cluster-management-global-set"   # ACM ns holding the OADP policy

# OADP automatic failover / auto-restore (use case 4, ACM policy)
# =========================================================================
# `oadp` also creates acm-policy-oadp-autorestore.yaml, which watches the VM on
# the spoke labelled `oadp-role=active`. If that VM stops being available for
# oadp_failover_grace_seconds, the hub hands the active role to the peer spoke,
# which restores the newest backup out of the shared bucket and then takes over
# the scheduled backups - so the same machinery runs in the other direction.
# Failback is a label flip you make yourself:
#   oc label managedcluster <back-to> oadp-role=active  --overwrite
#   oc label managedcluster <other>   oadp-role=standby --overwrite
# The initial roles are only assigned when no spoke carries an oadp-role label
# yet, so re-running `oadp` never yanks the role back after a failover.
oadp_autorestore_enabled: true            # set false to skip the auto-failover policy
oadp_dr_vm_name: "vm-dr-example"          # the VM protected by auto-failover
# Its OWN namespace, deliberately not vm-example: use case 1 (Ramen) DR-protects
# vm-example and ArgoCD keeps it synced, so an OADP failover there would be
# undone by GitOps and would fight Ramen. Same split as use case 3's
# vm-example-volsync namespace. Manifests live in vm-app-oadp/.
oadp_dr_vm_namespace: "vm-example-oadp"
oadp_deploy_demo_vm: true                 # deploy vm-app-oadp/ to the active spoke
# oadp_active: "cluster2"                 # spoke that starts as active (default: first spoke)
oadp_failover_grace_seconds: 30           # VM must stay unavailable this long before failover
oadp_standby_cleanup: true                # standby drops its stale VM copy + that VM's PVCs
                                          # (needed for failback: Velero will not re-hydrate an
                                          # existing PVC). Set false if something else owns the
                                          # VM namespace on the standby - e.g. Ramen (use case 1)
                                          # protecting the SAME namespace.
oadp_failover_timer_image: "registry.access.redhat.com/ubi9/ubi-minimal:latest"

# OpenShift GitOps operator channel (installed on hub for ArgoCD push mode)
gitops_channel: "latest"

# VM DR Example (OpenShift Virtualization + Regional DR)
# =========================================================================
# The virt command deploys a DR-protected VirtualMachine between spoke clusters:
#
# 1. Installs OpenShift Virtualization operator on spokes via ACM Policy
# 2. Deploys a Fedora VM with persistent data disk via GitOps (ArgoCD)
# 3. Protects the VM with DRPlacementControl for failover/relocate
#
# Prerequisites:
# 1. Clusters deployed: ./ansible-runner.sh deploy
# 2. Operators installed: ./ansible-runner.sh operators
# 3. Clusters imported: ./ansible-runner.sh import
# 4. DR infrastructure configured: ./ansible-runner.sh infra-dr
# 5. DR app deployed (for GitOps setup): ./ansible-runner.sh app
# 6. app_git_url configured pointing to repo with vm-app/ directory
#
# Configuration in inventory/host_vars/<cluster>.yml:
#   virt: true    # Enable CNV on this cluster (only needed if virt_deploy_all_clusters: false)
# =========================================================================

# OpenShift Virtualization operator channel (fallback; setup-virt.yml auto-discovers)
virt_channel: "stable"

# VM application namespace on spoke clusters
virt_namespace: "vm-example"

# VM application name (used for naming RHACM resources)
virt_app_name: "vm-dr-example"

# Whether to deploy CNV operator to ALL spoke clusters or only those with virt: true
virt_deploy_all_clusters: true

# Whether to ALSO install the OpenShift Virtualization operator on the hub cluster.
# Unlike the spokes, the hub is NOT given a bare-metal MachineSet, so the CNV
# control plane installs and the HyperConverged CR reconciles, but VMs cannot be
# scheduled on the hub until it has KVM-capable (.metal) nodes. Installed directly
# on the hub (not via ACM Policy) since the hub is local-cluster. Set false to skip.
virt_deploy_hub: true

# Whether `virt` should also deploy the Ramen DR-protected VM of USE CASE 1
# (Plays 6-7: the GitOps Application + DRPlacementControl for vm-dr-example).
# Those plays need OpenShift GitOps AND a DRPolicy, both created by
# `./ansible-runner.sh app`. Use cases 3 (volsync-dr --vm) and 4 (oadp) need the
# virtualization SUBSTRATE only - metal MachineSet + CNV + StorageClass, Plays
# 1-5 - and neither uses Ramen, so neither ever has a DRPolicy. When GitOps or
# the DRPolicy is absent the DR-VM plays are SKIPPED with an explanation rather
# than failing the run; set this to false to skip them unconditionally.
virt_deploy_dr_vm: true

# Path within the Git repo to the VM manifests directory
virt_git_path: "vm-app"

# Bare metal MachineSet for hardware virtualization support
# Instance type must support nested/hardware virtualization (e.g., m5.metal, c5.metal, i3.metal)
virt_metal_instance_type: "m5.metal"
virt_metal_replicas: 1
virt_metal_volume_size: 120
virt_metal_volume_type: "gp3"

# Cross-Cluster Live Migration (cclm)
# =========================================================================
# `cclm` enables KubeVirt decentralized live migration BETWEEN the two spoke
# clusters (non-ACM), carried over the Submariner fabric. It:
#   1. Enables the `decentralizedLiveMigration` feature gate on HyperConverged
#      on both spokes (spins up the virt-synchronization-controller, TCP 9185).
#   2. Cross-imports each spoke's kubevirt-ca into the other's
#      kubevirt-external-ca (the sync channel is mTLS against the KubeVirt CA).
# Requires: spokes on non-overlapping CIDRs + Submariner without globalnet, and
# OpenShift Virtualization installed on both spokes (./ansible-runner.sh virt).
#
# `cclm-migrate` performs a live migration; drive it with extra vars, e.g.:
#   ./ansible-runner.sh cclm-migrate -e cclm_vm=vm-dr-example \
#       -e cclm_from=cluster2 -e cclm_to=cluster3
cnv_namespace: "openshift-cnv"
cclm_sync_port: 9185
# Namespace the target/source VM live in (defaults to the DR VM namespace)
cclm_vm_namespace: "{{ virt_namespace }}"
# Max seconds to wait for a migration to reach Succeeded
cclm_migration_timeout: 1800

# Red Hat Service Interconnect (RHSI) + CloudNativePG cross-site Postgres - use case 5
# =========================================================================
# RHSI (Skupper v2, apiVersion skupper.io/v2alpha1) builds a layer-7 Virtual
# Application Network (VAN) between the two spokes so services reach each other ACROSS
# clusters WITHOUT Submariner / shared CIDRs. `rhsi` builds:
#   1. skupper-operator + Network Observer on each spoke
#   2. a Site per spoke (in cnpg_namespace) + an mTLS Link between them
#      (AccessGrant on the primary spoke -> AccessToken on the secondary spoke)
#   3. CloudNativePG operator on each spoke, and a distributed-topology Postgres:
#      a PRIMARY Cluster on the active spoke + a streaming REPLICA on the standby
#      spoke. RHSI carries the streaming replication AND the app write path.
#   4. an ACM policy engine (hub, enforced on spokes) keyed on the `pg-role:
#      active/standby` ManagedCluster label:
#        - both spokes get the CNPG `Cluster` (role driven by a hub template that
#          reads which spoke is pg-role=active) + a `pg-write` Skupper Listener.
#        - the active spoke additionally gets a `pg-write` Connector -> its local
#          primary (pruned when it stops being active, so the write path follows).
#        - a hub relay (ManagedClusterView -> hub ConfigMap -> hub templates)
#          carries CNPG's demotionToken from the old primary to the new one so the
#          label-flip is a zero-data-loss CONTROLLED switchover, not a failover.
# Failover = flip `pg-role` on the hub; CNPG promotes/demotes and the Connector moves.
# See "use case 5" in the README. Playbooks written but NOT yet run on live clusters.
# -- RHSI operators / fabric --------------------------------------------------
rhsi_channel: "stable-2"                        # skupper-operator v2 channel (v1 = stable-1)
# BOTH RHSI operators install into openshift-operators, which on OpenShift carries the
# `global-operators` OperatorGroup with an empty targetNamespaces -> AllNamespaces (cluster-wide)
# install mode, so Sites/Connectors/Listeners can be created in ANY namespace.
rhsi_operator_namespace: "openshift-operators"
# Service Interconnect Network Observer ("Observe") operator. Red Hat ships it in redhat-operators as
# `skupper-netobs-operator` (NOT "network-observer" - verified against a live 2.x catalog, default
# channel stable-2). If that package is missing the play falls back to discovery, then warns and skips.
# NB: the discovery pattern deliberately does NOT match `netobserv-operator`, which is the unrelated
# OpenShift Network Observability product. Empty channel = the package defaultChannel.
rhsi_install_observer: true
rhsi_observer_package: "skupper-netobs-operator"   # "" = auto-discover from packagemanifests
rhsi_observer_channel: ""                          # "" = package defaultChannel
rhsi_site_prefix: "rhsi"                        # Site name = <prefix>-<cluster_name>
rhsi_grant_name: "rhsi-grant"                   # AccessGrant on the primary spoke
rhsi_token_name: "rhsi-token"                   # AccessToken on the secondary spoke
# -- CloudNativePG (community CNPG) -------------------------------------------
# Distributed topology needs CNPG >= 1.24 (spec.replica.self/primary/source +
# promotionToken). Package/channel/CRD are the community `cloudnative-pg` build;
# verify against the live catalog (`oc get packagemanifest | grep -i cloudnative`).
cnpg_operator_namespace: "openshift-operators"  # AllNamespaces, so Clusters live in cnpg_namespace
cnpg_channel: "stable-v1"                        # verify: community CNPG channel
cnpg_package: "cloudnative-pg"                   # verify: packagemanifest name
cnpg_catalog_source: "certified-operators"     # verified live: cloudnative-pg ships in the CERTIFIED catalog, not community
cnpg_csv_display_name: "CloudNativePG"           # for the CSV-Succeeded wait
cnpg_namespace: "postgres-dr"                    # Site + CNPG Cluster + app all live here
cnpg_cluster_name: "pg"                           # Services: pg-rw / pg-ro / pg-r
cnpg_instances: 1
cnpg_storage_class: "ocs-storagecluster-ceph-rbd"
cnpg_storage_size: "1Gi"
cnpg_pg_port: 5432
cnpg_db_name: "appdb"                            # bootstrap.initdb database + app DB_NAME
cnpg_db_owner: "appuser"                          # bootstrap.initdb owner (creds in cnpg_app_secret)
cnpg_write_key: "pg-write"                        # the only cross-VAN routing key -> current primary
cnpg_read_service: "pg-r"                         # app reads its LOCAL any-instance Service (no VAN)
cnpg_ca_secret: "cnpg-ca"                         # shared CA (ca.crt + ca.key) side-loaded to both spokes
cnpg_replication_secret: "cnpg-replication"       # shared streaming_replica client cert (tls.crt/tls.key)
cnpg_app_secret: "cnpg-app-secret"               # basic-auth (username/password) for the app + initdb
# The sample app image (has psql; runs the read/write loop) is set in app-cnpg/pg-app.yaml
# -- ACM policy engine / failover control surface -----------------------------
cnpg_policy_namespace: "open-cluster-management-global-set"  # where the ACM policies live (hub)
cnpg_role_label: "pg-role"                        # ManagedCluster label: active|standby (flip = failover)
cnpg_active: ""                                   # "" = default to spoke_clusters[0] as the initial primary
cnpg_remove_operator: true                        # destroy: also uninstall the CNPG operator


---
# =============================================================================
# Regenerate docs/TEST-STATUS.md from the history ledger
# =============================================================================
# The point of the whole framework: one glance answers "when did each use case
# last pass, against which commit, on which versions". A pass recorded from a
# dirty tree or a dirty baseline is marked, because it is not reproducible.
# =============================================================================

- name: Read the history ledger
  slurp:
    src: "{{ test_results_dir }}/history.jsonl"
  register: test_history_raw
  delegate_to: localhost
  failed_when: false

- name: Parse the ledger
  set_fact:
    test_history: >-
      {{ (test_history_raw.content | default('') | b64decode).splitlines()
         | map('trim') | reject('equalto', '') | map('from_json') | list }}
  when: test_history_raw.content is defined

- name: Build the status page
  copy:
    dest: "{{ repo_root }}/docs/TEST-STATUS.md"
    mode: "0644"
    content: |
      # DR use case test status

      Generated by `./ansible-runner.sh test` - do not edit by hand.
      Last run: **{{ test_run_id }}**

      | # | Use case | Last result | When | Commit | Switchover/failover | Notes |
      |---|----------|-------------|------|--------|--------------------|-------|
      {% for uc in ['1','2','3','4','5'] %}
      {%- set runs = test_history | default([]) | selectattr('use_case.id', 'equalto', uc) | list %}
      {%- set last = runs | last if runs | length > 0 else none %}
      {%- set lastpass = (runs | selectattr('result', 'equalto', 'pass') | list | last) if (runs | selectattr('result', 'equalto', 'pass') | list | length) > 0 else none %}
      | {{ uc }} | {{ last.use_case.name if last else '-' }} | {{ (last.result | upper) if last else 'NEVER RUN' }} | {{ last.recorded_at if last else '-' }} | {{ last.git.commit if last else '-' }} | {{ (last.timings.values() | list | first ~ 's') if (last and last.timings) else '-' }} | {{ 'last pass ' ~ lastpass.recorded_at ~ ' @ ' ~ lastpass.git.commit if lastpass else 'no passing run on record' }}{{ ' (DIRTY TREE)' if last and last.caveats.git_dirty else '' }} |
      {% endfor %}

      ## What a result means

      - **PASS** - the prerequisite commands ran clean *and* seeded data was read
        back from the peer after the DR action. Verified at the receiver, on the
        payload, never on a status field.
      - **FAIL** - the environment is deliberately left as-is. See
        `test-results/usecase<N>/<run-id>-diagnostics/`.
      - **ENV-UNAVAILABLE** - clusters unreachable; proves nothing either way.

      {% if test_history | default([]) | length > 0 %}
      ## Environment of the most recent run

      ```
      {% set latest = test_history | last %}
      clusters : {{ latest.environment.clusters | default({}) }}
      git      : {{ latest.git.commit }} ({{ latest.git.branch }}){{ ', DIRTY' if latest.caveats.git_dirty else '' }}
      ```
      {% endif %}
  delegate_to: localhost

- name: Point at the status page
  debug:
    msg: "Status page written to docs/TEST-STATUS.md ; ledger at {{ test_results_dir }}/history.jsonl"

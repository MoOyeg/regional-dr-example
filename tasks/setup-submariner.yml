---
# Included from infra-dr.yml Play 3
# Loop variables:
#   managed_cluster_name — ACM managed cluster name (spoke hostname or "local-cluster" for hub)
#   managed_cluster_idx  — 0-based loop index (used for globalCIDR assignment)
# Runs on the hub cluster with hub's KUBECONFIG

- name: Look up AWS credentials for {{ managed_cluster_name }}
  set_fact:
    sub_aws_access_key: >-
      {{ lookup('ini', 'aws_access_key_id', section=hostvars[managed_cluster_name]['aws_profile'], file=aws_shared_credentials_file)
         if managed_cluster_name != 'local-cluster'
         else lookup('ini', 'aws_access_key_id', section=aws_profile, file=aws_shared_credentials_file) }}
    sub_aws_secret_key: >-
      {{ lookup('ini', 'aws_secret_access_key', section=hostvars[managed_cluster_name]['aws_profile'], file=aws_shared_credentials_file)
         if managed_cluster_name != 'local-cluster'
         else lookup('ini', 'aws_secret_access_key', section=aws_profile, file=aws_shared_credentials_file) }}

- name: Create AWS credentials secret for {{ managed_cluster_name }}
  shell: |
    oc apply -f - <<'EOF'
    apiVersion: v1
    kind: Secret
    metadata:
      name: {{ managed_cluster_name }}-aws-creds
      namespace: {{ managed_cluster_name }}
    type: Opaque
    stringData:
      aws_access_key_id: {{ sub_aws_access_key }}
      aws_secret_access_key: {{ sub_aws_secret_key }}
    EOF
  environment:
    KUBECONFIG: "{{ artifacts_dir }}/{{ cluster_name }}/kubeconfig"
  delegate_to: localhost

# Minimal infra: the cluster is Single-Node OpenShift and its one node doubles as
# the Submariner gateway, so label it here and omit the dedicated-gateway AWS block
# below (otherwise the addon would try to provision a separate gateway machine).
- name: (minimal-infra) Label the single node as the Submariner gateway on {{ managed_cluster_name }}
  shell: |
    NODE=$(oc get nodes -o jsonpath='{.items[0].metadata.name}')
    oc label node "$NODE" submariner.io/gateway=true --overwrite
  environment:
    KUBECONFIG: "{{ artifacts_dir }}/{{ cluster_name if managed_cluster_name == 'local-cluster' else managed_cluster_name }}/kubeconfig"
  delegate_to: localhost
  when: minimal_infra | default(false) | bool

- name: Create SubmarinerConfig for {{ managed_cluster_name }}
  shell: |
    oc apply -f - <<'EOF'
    apiVersion: submarineraddon.open-cluster-management.io/v1alpha1
    kind: SubmarinerConfig
    metadata:
      name: submariner
      namespace: {{ managed_cluster_name }}
    spec:
      gatewayConfig:
        gateways: 1
    {% if not (minimal_infra | default(false) | bool) %}
        aws:
          instanceType: {{ submariner_gateway_instance_type | default('m5.xlarge') }}
    {% endif %}
      IPSecNATTPort: 4500
      NATTEnable: true
      cableDriver: {{ submariner_cable_driver | default('vxlan') }}
      credentialsSecret:
        name: {{ managed_cluster_name }}-aws-creds
    {% if globalnet_enabled | default(false) %}
      globalCIDR: "242.{{ managed_cluster_idx | int + 1 }}.0.0/16"
    {% endif %}
    EOF
  environment:
    KUBECONFIG: "{{ artifacts_dir }}/{{ cluster_name }}/kubeconfig"
  delegate_to: localhost

- name: Create Submariner ManagedClusterAddOn for {{ managed_cluster_name }}
  shell: |
    oc apply -f - <<'EOF'
    apiVersion: addon.open-cluster-management.io/v1alpha1
    kind: ManagedClusterAddOn
    metadata:
      name: submariner
      namespace: {{ managed_cluster_name }}
    spec:
      installNamespace: submariner-operator
    EOF
  environment:
    KUBECONFIG: "{{ artifacts_dir }}/{{ cluster_name }}/kubeconfig"
  delegate_to: localhost

- name: Wait for Submariner addon on {{ managed_cluster_name }}
  shell: |
    oc get managedclusteraddon submariner -n {{ managed_cluster_name }} -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ artifacts_dir }}/{{ cluster_name }}/kubeconfig"
  delegate_to: localhost
  register: submariner_status
  until: "'True' in submariner_status.stdout"
  retries: 40
  delay: 30
  ignore_errors: true

- name: Display Submariner status for {{ managed_cluster_name }}
  debug:
    msg: >-
      Submariner for {{ managed_cluster_name }}:
      {{ 'Available' if 'True' in (submariner_status.stdout | default('')) else 'Still progressing (verify manually)' }}
